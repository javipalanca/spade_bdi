[build-system]
requires = [
    "setuptools>=77.0.0",
    "wheel"
    ]
build-backend = "setuptools.build_meta"

[project]
name = "spade_bdi"
dynamic = ["version"]
dependencies = [
    "spade>=4.1.4",
    "agentspeak>=0.2.2",
    "loguru>=0.7.3"
]
description = "Plugin for SPADE 3 MAS platform to implement BDI Agents."
authors = [{ name = "Javi Palanca", email = "jpalanca@gmail.com" }]
maintainers = [{ name = "Javi Palanca", email = "jpalanca@gmail.com" }]
license = "MIT"
readme = "README.rst"
keywords = ["spade", "spade_bdi", "bdi", "cognitive"]
requires-python = ">=3.10, <=3.14"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: XMPP"
]

[project.optional-dependencies]
dev = [
    "bump-my-version==1.3.0",
    "wheel==0.47.0",
    "watchdog==6.0.0",
    "ruff>=0.15.13",
    "black>=26.3.1",
    "tox>=4.54.0",
    "coverage==7.14.0",
    "pytest==9.0.3",
]

docs = [
    "Sphinx==8.1.3",
    "sphinx-rtd-theme==3.1.0"
]

[project.urls]
Homepage = "https://spadeagents.eu/plugins/spade-bdi/"
Repository = "https://github.com/javipalanca/spade_bdi"
Documentation = "https://spade-bdi.readthedocs.io"

[project.scripts]
spade = "spade.cli:cli"

[tool.setuptools]
packages = ["spade_bdi"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "spade_bdi.__version__"}

[tool.ruff]
lint.select = ["E", "F"]
lint.ignore = ["E501"]
line-length = 88
target-version = "py38"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["spade_bdi"]
